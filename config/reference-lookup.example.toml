# Internal evidence only. Copy into data/private and review before enabling.
[lookup]
enabled = false
shadow = true
network_enabled = false
provider = "brave"
key_env = "BRAVE_SEARCH_API_KEY"
cache_root = "data/private/reference-lookup"
fixture_root = "tests/fixtures/reference_lookup"
max_search_requests = 6
max_pages = 6
timeout_seconds = 15
total_seconds = 120
request_interval_seconds = 10
retries = 1
cache_seconds = 3600
phrase_words = 16

# Browsing review on 2026-10-01 is not automatic-fetch authorization.
